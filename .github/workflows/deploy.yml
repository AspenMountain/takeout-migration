name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: HOST_PORT
          script: |
            set -e
            cd ${{ vars.HOST_PATH }}
            git pull
            echo "HOST_PORT=${HOST_PORT:-8000}" > .env
            sudo docker compose up -d --build
            sudo docker image prune -f   # reclaim space from old layers
        env:
          HOST_PORT: ${{ vars.HOST_PORT }}
