services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    read_only: true          # filesystem is read-only; uploads live only in tmpfs
    #tmpfs:
      # Budget: uploads + extracted tree + output zip.
      # Rule of thumb: (sum of input archive sizes) × 4, rounded up to next 4 GB.
      # A full two-part Takeout (2 × 2 GB in) needs ~20 GB here.
      # Override with TMPFS_SIZE in .env (e.g. TMPFS_SIZE=32g).
      #- /tmp:size=${TMPFS_SIZE:-20g},mode=1777
    restart: unless-stopped
    volumes:
      - /mnt/sdz:/tmp
    environment:
      - TMPDIR=/tmp
      # Override worker count here or via a .env file.
      # Default: (2 × CPU count) + 1  (set in gunicorn.conf.py)
      # - WEB_CONCURRENCY=5
      # Max upload size in MB (default 2048 = 2 GB).
      - MAX_UPLOAD_MB=8196
      # Per-file cap for Drive/Wallet pass-throughs in MB (default 500).
      # - MAX_PASSTHROUGH_MB=500
      # Gunicorn worker timeout in seconds (default 300).
      # - GUNICORN_TIMEOUT=300
