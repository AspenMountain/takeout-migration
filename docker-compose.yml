services:
  web:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    read_only: true          # filesystem is read-only; uploads live only in tmpfs
    tmpfs:
      # Each request can hold up to ~1 GB of intermediate files (input + extracted).
      # Size this to workers * ~500 MB; adjust WEB_CONCURRENCY and size together.
      - /tmp:size=4g,mode=1777
    environment:
      - TMPDIR=/tmp
      # Override worker count here or via a .env file.
      # Default: (2 × CPU count) + 1  (set in gunicorn.conf.py)
      # - WEB_CONCURRENCY=5
